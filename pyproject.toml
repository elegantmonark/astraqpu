[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astraqpu"
version = "0.1.0"
description = "A virtual QPU runtime for architecture aware scheduling, control, and hardware in the loop execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Trishan Biswas" }
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
yaml = ["PyYAML>=6.0"]
dev = ["PyYAML>=6.0", "pyserial>=3.5"]

[project.scripts]
astraqpu = "astraqpu.cli:main"

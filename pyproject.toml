[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astraqpu"
version = "0.1.0"
description = "A virtual QPU runtime for architecture-aware scheduling, control, and hardware-in-the-loop execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AstraQPU Contributors" }
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["PyYAML>=6.0"]

[project.scripts]
astraqpu = "astraqpu.cli:main"

